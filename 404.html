    :root {
      --bg: #f4f0e6;
      --ink: #171510;

      --line: #b7ab94;
      --accent: #b83a1c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12110e;
        --ink: #f0ecdf;
        --muted: #948c7b;
        --line: #4a4336;
        --accent: #ff7048;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      text-align: center;
    }
    main { max-width: 560px; }
    .mark {
      width: 44px;
      height: 44px;
      margin: 0 auto 32px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      color: var(--accent);
    }
    .code {
      font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      font-size: clamp(6rem, 22vw, 10rem);
      line-height: 0.8;
      color: transparent;
      -webkit-text-stroke: 1px var(--line);
      margin: 0;
    }
    h1 {
      margin: 22px 0 0;
      font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      font-weight: 400;
      font-size: clamp(2rem, 6vw, 3rem);
      line-height: 1;
      letter-spacing: -0.03em;
    }
    p {
      margin: 16px auto 0;
      max-width: 42ch;
      color: var(--muted);
      line-height: 1.65;
      font-size: 0.95rem;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 32px;
    }
    a {
      display: inline-block;
      padding: 11px 16px;
      border: 1px solid var(--line);
      color: var(--ink);
      text-decoration: none;
      font-size: 0.8rem;
    }
    a:hover { border-color: var(--ink); }
    a.primary {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--bg);
    }
    .mono {
      margin-top: 40px;
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 0.6rem;
      letter-spacing: 0.14em;
      color: var(--muted);
